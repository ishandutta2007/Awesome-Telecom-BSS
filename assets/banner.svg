<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 52px; fill: url(#accent); }
      .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
      .tag { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; letter-spacing: 2px; }
      .pulse-wave { animation: wave 4s ease-in-out infinite alternate; }
      .float-node { animation: float 3s ease-in-out infinite alternate; }
      @keyframes wave {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 200; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="2" />
  
  <!-- Subtle Grid Lines -->
  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200" stroke="#1e293b" stroke-width="1" />
  <path d="M200 0 V300 M400 0 V300 M600 0 V300 M800 0 V300 M1000 0 V300" stroke="#1e293b" stroke-width="1" />

  <!-- Dynamic Glowing Graphic Waves (Monetization & Network Traffic Waves) -->
  <path d="M 50,220 Q 200,100 350,190 T 650,150 T 950,230 T 1150,120" fill="none" stroke="url(#glow)" stroke-width="24" />
  <path d="M 50,220 Q 200,100 350,190 T 650,150 T 950,230 T 1150,120" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="12 8" class="pulse-wave" />

  <path d="M 50,100 Q 250,250 450,120 T 750,200 T 1050,110 T 1150,180" fill="none" stroke="#818cf8" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="6 6" />

  <!-- Interactive Graphic Nodes -->
  <g class="float-node">
    <circle cx="350" cy="190" r="8" fill="#38bdf8" />
    <circle cx="350" cy="190" r="16" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2" />
    <circle cx="650" cy="150" r="8" fill="#818cf8" />
    <circle cx="650" cy="150" r="16" fill="none" stroke="#818cf8" stroke-opacity="0.5" stroke-width="2" />
    <circle cx="950" cy="230" r="8" fill="#c084fc" />
    <circle cx="950" cy="230" r="16" fill="none" stroke="#c084fc" stroke-opacity="0.5" stroke-width="2" />
  </g>

  <!-- Typography & Text Content -->
  <g transform="translate(80, 110)">
    <text x="0" y="0" class="tag">TELECOM MONETIZATION &amp; BSS ECOSYSTEM</text>
    <text x="0" y="55" class="title">Awesome Telecom BSS 📡⚡</text>
    <text x="0" y="98" class="subtitle">Curated SaaS Platforms, Real-Time Rating Engines &amp; Open BSS Stacks</text>
  </g>

  <!-- Decorative Corner Icon -->
  <g transform="translate(1040, 50)" fill="url(#accent)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <path d="M 25 55 L 25 45 L 35 45 L 35 55 Z M 40 55 L 40 35 L 50 35 L 50 55 Z M 55 55 L 55 25 L 65 25 L 65 55 Z" fill="url(#accent)" />
  </g>
</svg>
